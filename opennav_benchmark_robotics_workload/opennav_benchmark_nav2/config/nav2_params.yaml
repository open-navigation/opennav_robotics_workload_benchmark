laserscan_merger:
  ros__parameters:
    destination_frame: "base_link"
    scan_topics: ["/scan_front_left", "/scan_front_right"]
    merged_scan_topic: "/scan_merged"
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.006544
    range_min: 0.1
    range_max: 25.0
    scan_stale_dur: 0.5

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false  # For benchmarking, use simulation's positioning to remove error vector from computational load measurements of actual interest
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_merged

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: $(find-pkg-share opennav_benchmark_nav2)/config/nav2_vlm_hazard_bt.xml
    plugin_lib_names:
      - vlm_query_bool_action_bt_node
      - vlm_query_int_action_bt_node
      - vlm_query_string_action_bt_node
      - vlm_check_bool_bt_node
      - vlm_mark_lethal_ahead_bt_node
      - vlm_set_temp_speed_limit_bt_node
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    enable_stamped_cmd_vel: true
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # MPPI allows the vehicle to have dynamic behavior, track paths accurately, and get out 
    # of confined or challenging situations by itself.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      az_max: 3.5
      vx_std: 0.4
      wz_std: 0.5
      vx_max: 2.0
      vx_min: -2.0
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 10.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 
        offset_from_furthest: 15
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0

    # SmacPlannerHybrid with Reeds-Shepp for forklift warehouse navigation
    # enables reverse motion planning needed for pallet approach/dock maneuvers
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.30
      allow_unknown: true
      max_iterations: 100000000
      max_on_approach_iterations: 1000
      max_planning_time: 8.0
      motion_model_for_search: "REEDS_SHEPP"
      allow_primitive_interpolation: true
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      use_quadratic_cost_penalty: false
      minimum_turning_radius: 0.75
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["path_smoother"]
    # Path smoother using complex constraints to consider robot non-circular footprint, with turning constraints, and away from obstacles
    path_smoother: 
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: true
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 0.75
      w_curve: 0.5
      w_dist: 0.0
      w_smooth: 3.0e+3
      w_cost: 0.000045
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 50.0
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.9]
    min_velocity: [-2.0, 0.0, -1.9]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Larger window for higher speed, prediction horizon, maneuvering opportunity, stopping requirements
      width: 12
      height: 12
      resolution: 0.05
      # Forklift footprint: chassis 1.2x0.8m + tines with pallet
      footprint: "[[0.7, -0.6], [0.7, 0.6], [-1.25, 0.6], [-1.25, -0.6]]"
      # Forklift footprint: chassis 1.2x0.8m + tines without pallet, to switch to when not holding a pallet
      # footprint: "[[0.7, -0.6], [0.7, 0.6], [-0.7, 0.6], [-0.7, 0.45], [-1.25, 0.45], [-1.25, -0.45], [-0.7, -0.45], [-0.7, -0.6]]"
      plugins: ["obstacle_layer", "voxel_layer", "stvl_layer", "inflation_layer"]
      # 2D lidars use 2D obstacle layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front_left scan_front_right
        scan_front_left:
          topic: /scan_front_left
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 25.0
          raytrace_min_range: 0.1
          obstacle_max_range: 24.0
          obstacle_min_range: 0.1
          inf_is_valid: True
        scan_front_right:
          topic: /scan_front_right
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 25.0
          raytrace_min_range: 0.1
          obstacle_max_range: 24.0
          obstacle_min_range: 0.1
          inf_is_valid: True
      # Depth cameras use the Voxel Layer
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 3.5
        mark_threshold: 2
        # 3D Ouster lidars (360deg, 30m range) + Orbbec depth cameras (7m range)
        observation_sources: camera_front_left camera_front_right camera_rear vlm_obstacles
        camera_front_left:
          topic: /camera_front_left/points
          max_obstacle_height: 3.5
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.5
          obstacle_min_range: 0.1
        camera_front_right:
          topic: /camera_front_right/points
          max_obstacle_height: 3.5
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.5
          obstacle_min_range: 0.1
        camera_rear:
          topic: /camera_rear/points
          max_obstacle_height: 3.5
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.5
          obstacle_min_range: 0.1
        vlm_obstacles:
          topic: /vlm_virtual_obstacles
          max_obstacle_height: 3.5
          min_obstacle_height: 0.1
          clearing: False
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: lidar_3d_center lidar_3d_top lidar_3d_tilted
        lidar_3d_center:
          data_type: PointCloud2
          topic: /lidar_3d_center/points
          marking: true
          clearing: true
          obstacle_range: 15.0
          min_obstacle_height: 0.2
          max_obstacle_height: 3.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 15.0
          min_z: 0.3
          vertical_fov_angle: 0.558505361
          vertical_fov_padding: 0.05 
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          model_type: 1
        lidar_3d_tilted:
          data_type: PointCloud2
          topic: /lidar_3d_tilted/points
          marking: true
          clearing: true
          obstacle_range: 15.0
          min_obstacle_height: 0.2
          max_obstacle_height: 3.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 15.0
          min_z: 0.3
          vertical_fov_angle: 0.558505361
          vertical_fov_padding: 0.05 
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          model_type: 1
        lidar_3d_top:
          data_type: PointCloud2
          topic: /lidar_3d_top/points
          marking: true
          clearing: true
          obstacle_range: 15.0
          min_obstacle_height: 0.2
          max_obstacle_height: 3.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 15.0
          min_z: 0.3
          vertical_fov_angle: 0.558505361
          vertical_fov_padding: 0.05 
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          model_type: 1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 4.0
      always_send_full_costmap: True

